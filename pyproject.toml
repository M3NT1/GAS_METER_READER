[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-photo"
version = "0.1.0"
description = "Photo-time gas meter readings for Home Assistant"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pillow>=11,<13", "pillow-heif>=0.20,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
gas-photo = "gasphoto.__main__:main"

[tool.setuptools.packages.find]
include = ["gasphoto*"]

[tool.setuptools.package-data]
gasphoto = ["static/*", "ocr.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
